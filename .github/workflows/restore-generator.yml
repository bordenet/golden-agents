name: Assemble generator

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-generator.yml

jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts
        run: |
          set -euo pipefail
          cat .github/restore-generator/part* > /tmp/generate-agents.sh
          wc -c /tmp/generate-agents.sh
          grep -q relocate_custom_quality_gates /tmp/generate-agents.sh
      - name: Write generate-agents.sh through the contents API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('/tmp/generate-agents.sh')
            if (body.length !== 94430) {
              core.setFailed('unexpected size ' + body.length)
              return
            }
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'generate-agents.sh',
              ref: context.sha
            })
            const result = await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'generate-agents.sh',
              message: 'Restore the full generate-agents.sh.',
              content: body.toString('base64'),
              sha: current.data.sha,
              branch: 'main'
            })
            core.info('commit ' + result.data.commit.sha)

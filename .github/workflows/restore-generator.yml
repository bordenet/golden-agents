name: Assemble generator

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-generator.yml

jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write generate-agents.sh from the verified parts
        run: |
          set +e
          {
            set -x
            ls -l .github/restore-generator
            cat .github/restore-generator/part* > generate-agents.sh
            echo CAT:$?
            wc -c generate-agents.sh
            chmod +x generate-agents.sh
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add generate-agents.sh
            git commit -m "Restore the full generate-agents.sh."
            echo COMMIT:$?
            git push
            echo PUSH:$?
          } > /tmp/assemble-log.txt 2>&1
          tail -c 3000 /tmp/assemble-log.txt | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' > /tmp/assemble-esc.txt
          echo "::error title=assemble log::$(cat /tmp/assemble-esc.txt)"
          tail -c 3000 /tmp/assemble-log.txt
          grep -q '^PUSH:0$' /tmp/assemble-log.txt
